name: Publish GitHub Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag already published to npm
        required: true
        type: string

permissions: {}

concurrency:
  group: github-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'H1V35/hivex' && github.actor == 'H1V35'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Pin the registry client
        run: npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Download the published npm archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
          package_version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/hivex-package"
          cd "$RUNNER_TEMP/hivex-package"
          npm pack "@h1v35/hivex@$package_version" --ignore-scripts --registry=https://registry.npmjs.org
          archive="h1v35-hivex-$package_version.tgz"
          expected="$(npm view "@h1v35/hivex@$package_version" dist.integrity --registry=https://registry.npmjs.org)"
          actual="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$actual" = "$expected"
          tar -xOf "$archive" package/package.json | jq -e --arg version "$package_version" \
            '.name == "@h1v35/hivex" and .version == $version and .repository.url == "git+https://github.com/H1V35/hivex.git"'
      - name: Publish the same archive to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="${RELEASE_TAG#v}"
          cd "$RUNNER_TEMP/hivex-package"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/hivex-package.npmrc"
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          expected="sha512-$(openssl dgst -sha512 -binary "h1v35-hivex-$package_version.tgz" | openssl base64 -A)"
          if npm view "@h1v35/hivex@$package_version" version --json --registry=https://npm.pkg.github.com > existing.json 2> existing-error.log; then
            test "$(jq -r . existing.json)" = "$package_version"
          else
            jq -e '.error.code == "E404"' existing.json > /dev/null || { cat existing-error.log >&2; exit 1; }
            npm publish "h1v35-hivex-$package_version.tgz" --ignore-scripts --access public --registry=https://npm.pkg.github.com
          fi
          mkdir -p verified
          for attempt in 1 2 3 4 5 6; do
            if npm pack "@h1v35/hivex@$package_version" --ignore-scripts --json --pack-destination verified --registry=https://npm.pkg.github.com > published.json 2> published-error.log; then
              actual="sha512-$(openssl dgst -sha512 -binary "verified/h1v35-hivex-$package_version.tgz" | openssl base64 -A)"
              test "$actual" = "$expected" || { echo 'GitHub package has different integrity' >&2; exit 1; }
              exit 0
            fi
            jq -e '.error.code == "E404"' published.json > /dev/null || { cat published-error.log >&2; exit 1; }
            sleep 5
          done
          exit 1
