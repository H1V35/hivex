name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Verify and install dependencies
        run: bun tooling/install-verified.ts
      - name: Typecheck
        run: bun run --bun typecheck
      - name: Lint
        run: bun run --bun lint
      - name: Format
        run: bun run --bun format:check
      - name: Test
        run: bun test ./src ./tooling/dependencies
      - name: Reproduce the bootstrap checker
        run: |
          bun tooling/build-checker.ts
          git diff --exit-code -- tooling/generated
