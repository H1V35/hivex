name: Quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, macOS, ARM64, hivex]
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Install dependencies
        run: bun ci
      - name: Typecheck
        run: bun run --bun typecheck
      - name: Lint
        run: bun run --bun lint
      - name: Format
        run: bun run --bun format:check
      - name: Test
        run: bun run test
      - name: Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust test
        run: cargo test --locked
      - name: Rust CLI compatibility
        run: |
          cargo build --locked
          HIVEX_TEST_BINARY="$PWD/target/debug/hivex-rust" bun test --timeout 15000 src/documents-cli.test.ts src/project-initialization.test.ts src/knowledge-maintenance.test.ts src/knowledge-cli.test.ts src/knowledge-cache-compatibility.test.ts src/knowledge-warning-resolution.test.ts src/rust-compatibility.test.ts
