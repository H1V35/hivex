name: Quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, macOS, ARM64, hivex]
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Native development gate without Bun or Node
        run: |
          export PATH="$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v bun || command -v node; then exit 1; fi
          cargo fmt --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --bins
          cargo test --locked --bins
      - name: Native package and archive verification
        run: |
          export PATH="$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          cargo run --locked --bin hivex-dev -- pack "$RUNNER_TEMP/hivex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          HIVEX_TEST_BINARY="$PWD/target/aarch64-apple-darwin/release/hivex" cargo test --locked --test cli
          cargo run --locked --bin hivex-dev -- verify "$RUNNER_TEMP/hivex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
