name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects stable with clippy and rustfmt.
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --bin hivex
      # Contract deadlines assume an optimized executable, as users install it.
      - name: cargo test --locked (contracts against the release executable)
        run: |
          binary=target/release/hivex
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          HIVEX_TEST_BINARY="$binary" cargo test --locked

  # The ruleset requires one `quality` check; it passes only when every platform passed.
  quality:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.platform.result }}" = success
