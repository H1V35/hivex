[package]
name = "hivex"
version = "0.14.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
default-run = "hivex"

[[bin]]
name = "hivex"
path = "src/main.rs"

[[bin]]
name = "hivex-dev"
path = "tools/development.rs"

[dependencies]
globset = "0.4"
icu_collator = "2.3"
icu_locale_core = "2.3"
granit-parser = "2.0"
num-traits = "0.2"
pulldown-cmark = "0.13"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
url = "2.5"


[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_else = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
excessive_nesting = "warn"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
rust-code-analysis = "=0.0.25"
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
